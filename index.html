<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1420" />
    <link rel="icon" href="data:," />
    <title>小小射手 · 体感足球</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage3d"></canvas>
      <canvas id="stage"></canvas>

      <div id="hud" class="hidden">
        <div class="hud-left">
          <div class="pill score-pill">
            <span class="pill-label">得分</span>
            <span id="score">0</span>
          </div>
          <div class="pill streak-pill hidden" id="streak">
            <span class="flame">🔥</span>
            <span id="streak-value">2</span>
          </div>
        </div>
        <div class="hud-right">
          <div class="pill timer-pill hidden" id="timer">
            <span id="timer-value">90</span><span class="unit">秒</span>
          </div>
          <button id="btn-sound" class="icon-btn" title="声音开/关" aria-label="声音开/关">🔊</button>
          <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">⚙️</button>
          <button id="btn-fullscreen" class="icon-btn" title="全屏" aria-label="全屏">⛶</button>
        </div>
      </div>

      <div id="hint" class="hint hidden"></div>
      <div id="demo-badge" class="demo-badge hidden">演示模式 · 按 D 切换</div>

      <section id="start" class="overlay">
        <div class="card start-card">
          <div class="logo">⚽</div>
          <h1>小小射手</h1>
          <p class="tagline">站到电视前，用脚把球踢进球门</p>
          <div class="steps">
            <div class="step">
              <div class="n">1</div>
              <div><b>站好</b><span>离摄像头 2～3 米，全身都在画面里</span></div>
            </div>
            <div class="step">
              <div class="n">2</div>
              <div><b>看球</b><span>足球会一直停在你脚边</span></div>
            </div>
            <div class="step">
              <div class="n">3</div>
              <div><b>踢它</b><span>抬脚向球挥过去，球就飞向球门</span></div>
            </div>
          </div>
          <button id="btn-start" class="primary">开始游戏</button>
          <button id="btn-demo" class="ghost">没有摄像头？看演示</button>
          <p class="privacy">画面只在这台设备上处理，不会上传任何视频。</p>
        </div>
      </section>

      <section id="settings" class="overlay hidden">
        <div class="card settings-card">
          <h2>设置</h2>

          <div class="field">
            <label>难度</label>
            <div class="segmented" id="seg-difficulty">
              <button data-value="easy">萌新</button>
              <button data-value="normal">小将</button>
              <button data-value="pro">球星</button>
            </div>
            <p class="field-note" id="difficulty-note"></p>
          </div>

          <div class="field">
            <label>比赛模式</label>
            <div class="segmented" id="seg-mode">
              <button data-value="free">自由练习</button>
              <button data-value="timed">60 秒挑战</button>
            </div>
          </div>

          <div class="field">
            <label>场上形象</label>
            <div class="segmented" id="seg-avatar">
              <button data-value="3d">写实 3D 球员</button>
              <button data-value="stylized">风格化抠像</button>
              <button data-value="real">真人抠像</button>
            </div>
            <p class="field-note">写实 3D 使用透视球场与三维人物：人面向球门，球在人与球门之间；两种抠像保留正面视角</p>
          </div>

          <div class="field row-field">
            <label for="toggle-keeper">守门员</label>
            <button id="toggle-keeper" class="switch" role="switch" aria-checked="true"><span></span></button>
          </div>

          <div class="field row-field">
            <label for="toggle-sound">音效</label>
            <button id="toggle-sound" class="switch" role="switch" aria-checked="true"><span></span></button>
          </div>

          <div class="field row-field">
            <label for="toggle-speech">语音鼓励</label>
            <button id="toggle-speech" class="switch" role="switch" aria-checked="true"><span></span></button>
          </div>

          <div class="field row-field">
            <label for="toggle-mirror">镜像画面</label>
            <button id="toggle-mirror" class="switch" role="switch" aria-checked="true"><span></span></button>
          </div>

          <div class="field row-field">
            <label for="toggle-skeleton">显示骨架</label>
            <button id="toggle-skeleton" class="switch" role="switch" aria-checked="false"><span></span></button>
          </div>

          <div class="actions">
            <button id="btn-close-settings" class="primary">继续游戏</button>
          </div>
        </div>
      </section>

      <section id="countdown" class="overlay hidden">
        <div id="countdown-num" class="countdown-num">3</div>
        <p class="countdown-tip">站到球旁边，准备踢球！</p>
      </section>

      <section id="results" class="overlay hidden">
        <div class="card results-card">
          <h2 id="results-title">比赛结束</h2>
          <div class="big-score" id="results-score">0</div>
          <div class="result-grid">
            <div><span>进球</span><b id="results-goals">0</b></div>
            <div><span>射门</span><b id="results-shots">0</b></div>
            <div><span>命中率</span><b id="results-acc">0%</b></div>
            <div><span>最佳连击</span><b id="results-streak">0</b></div>
          </div>
          <p id="results-note" class="results-note"></p>
          <div class="actions">
            <button id="btn-replay" class="primary">再玩一次</button>
            <button id="btn-home" class="ghost">回到首页</button>
          </div>
        </div>
      </section>

      <div id="loading" class="overlay hidden">
        <div class="card loading-card">
          <div class="spinner"></div>
          <p id="loading-text">正在准备…</p>
          <p class="loading-sub">首次加载模型约需几秒</p>
        </div>
      </div>

      <div id="error" class="overlay hidden">
        <div class="card error-card">
          <h2>摄像头打不开</h2>
          <p id="error-text"></p>
          <div class="actions">
            <button id="btn-retry" class="primary">重试</button>
            <button id="btn-error-demo" class="ghost">使用演示模式</button>
          </div>
        </div>
      </div>

      <video id="video" playsinline muted autoplay></video>
    </div>
    <script type="importmap">
      {"imports":{"three":"./vendor/three/three.module.min.js"}}
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
